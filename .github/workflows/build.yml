name: Compilar APK Raylib Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NDK 25
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
      - name: Compilar Raylib ARM64
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          GLUE=$NDK/sources/android/native_app_glue
          make PLATFORM=PLATFORM_ANDROID ANDROID_NDK=$NDK ANDROID_ARCH=arm64 ANDROID_API_VERSION=24 -j4
      - name: Empacotar APK
        run: |
          mkdir -p apk/lib/arm64-v8a apk/assets
          cp -r assets/* apk/assets/ 2>/dev/null || true
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          GLUE=$NDK/sources/android/native_app_glue
          $BIN/aarch64-linux-android24-clang++ -shared -fPIC -o apk/lib/arm64-v8a/libmain.so main.cpp raylib/src/libraylib.a -O2 -std=c++17 -DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2 -Iraylib/src -I$GLUE -llog -landroid -lEGL -lGLESv2 -lOpenSLES -lm -u ANativeActivity_onCreate
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://android.com\" package=\"com.jonathan.meujogo3d\" android:versionCode=\"1\" android:versionName=\"1.0\"><uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"33\"/><uses-feature android:glEsVersion=\"0x00020000\" android:required=\"true\"/><application android:label=\"MeuJogo3D\" android:hasCode=\"false\"><activity android:name=\"android.app.NativeActivity\" android:theme=\"@android:style/Theme.NoTitleBar.Fullscreen\" android:configChanges=\"orientation|keyboardHidden|screenSize\" android:screenOrientation=\"landscape\" android:exported=\"true\"><meta-data android:name=\"android.app.lib_name\" android:value=\"main\"/><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>" > AndroidManifest.xml
          BT=$ANDROID_HOME/build-tools/33.0.2
          PL=$ANDROID_HOME/platforms/android-33/android.jar
          $BT/aapt package -f -M AndroidManifest.xml -I $PL -A apk/assets -F raw.apk apk
          $BT/zipalign -f 4 raw.apk aligned.apk
          keytool -genkeypair -v -keystore k.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Dev,O=Dev,C=BR"
          $BT/apksigner sign --ks k.jks --ks-pass pass:android --out MeuJogo3D.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeuJogo3D-APK
          path: MeuJogo3D.apk
